# Builds the Hugo site and deploys per-branch:
#   main    -> GitHub Pages  (production, https://kennethho.ca)
#   staging -> Cloudflare Pages (staging, https://stg.kennethho.ca)
name: build and deploy site

on:
  # Triggers upon push (includes PR, merge, squash or rebase) to these branches:
  push:
    branches:
      - main
      - staging

  # Allow manually specifying which branch to run deploy on
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment PER BRANCH, so a staging deploy never
# cancels/queues behind a production deploy (or vice versa).
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  # Builds for production and staging environment
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Pick the baseURL for this branch so canonical links, sitemap and RSS
      # point at the right host instead of always at production.
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "base_url=https://kennethho.ca/" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://stg.kennethho.ca/" >> "$GITHUB_OUTPUT"
          fi

      # Only needed for the GitHub Pages (production) path.
      - name: Setup Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.env.outputs.base_url }}"

      # GitHub Pages custom domain marker (production only). Cloudflare Pages
      # gets its custom domain from the dashboard, so no CNAME file there.
      - name: Create CNAME file for custom domain
        if: github.ref == 'refs/heads/main'
        run: echo "kennethho.ca" > ./public/CNAME

      # Production artifact -> consumed by the GitHub Pages deploy job.
      - name: Upload Pages artifact (production)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      # Staging artifact -> consumed by the Cloudflare deploy job.
      - name: Upload build output (staging)
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: ./public

  # Production deployment -> GitHub Pages
  deploy-production:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Staging deployment -> Cloudflare Pages (Direct Upload via Wrangler)
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: public
          path: ./public

      # --branch=staging must match the Cloudflare project's PRODUCTION branch
      # so this deploy is served on the stg.kennethho.ca custom domain (custom
      # domains attach to the production deployment, not to previews).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=kennethho-stg --branch=staging
